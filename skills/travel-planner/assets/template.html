<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行攻略</title>
<style>
:root {
  --bg: #F7F6F1;
  --card-bg: #ffffff;
  --card-hover: #f3f2ef;
  --text: #1A1A18;
  --text-secondary: #595957;
  --muted: #8F8F8D;            /* 烟 Smoke —— 仅装饰用途，不用于正文 */
  --muted-dark: #6E6E6C;       /* 浅说明文字（对比度合格） */
  --accent: #3A7D68;
  --accent-hover: #52A688;
  --accent-soft: #E8F2EE;
  --amber: #D4920A;
  --amber-dark: #8A5F03;       /* 琥 深色文字版（徽章用，对比度合格） */
  --amber-soft: #F8EDD6;
  --red: #D94F3D;
  --red-soft: #FAE3DF;
  --sky: #3B87CC;
  --sky-soft: #EAF3FB;
  --border: #EBEBEA;
  --hairline: #F0EFEC;
  --shadow-sm: 0 0.06rem 0.17rem rgba(58,125,104,.06);
  --shadow-md: 0 0.22rem 0.89rem rgba(58,125,104,.08);
  --radius-sm: 0.44rem;
  --radius: 0.78rem;
  --radius-lg: 1.11rem;
  --serif: "Songti SC","Noto Serif SC",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html { font-size: 18px; scroll-behavior: smooth; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  max-width: 34.4rem;
  margin: 0 auto;
}

/* === 封面（杂志风，按天气切换渐变） === */
header {
  color: #fff;
  padding: 2.2rem 1.11rem 2.4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header.cover-default { background: linear-gradient(135deg, #3A7D68 0%, #2C5F4F 100%); }
header.cover-sunny   { background: linear-gradient(135deg, #D4920A 0%, #E8B94A 100%); }
header.cover-rainy   { background: linear-gradient(135deg, #3B87CC 0%, #6B9DC7 100%); }
header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
}
header h1 {
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.4;
  margin-bottom: 0.55rem;
  text-wrap: balance;
  position: relative;
}
header .subtitle {
  font-size: 0.98rem;
  line-height: 1.6;
  opacity: .92;
  margin-bottom: 0.7rem;
  position: relative;
}
header .meta {
  font-size: 0.85rem;
  display: flex;
  justify-content: center;
  gap: 0.45rem;
  flex-wrap: wrap;
  font-weight: 500;
  position: relative;
}
header .meta span {
  display: inline-flex;
  align-items: center;
  background: rgba(255,255,255,.18);
  border-radius: 1rem;
  padding: 0.16rem 0.7rem;
  line-height: 1.5;
}

/* === 天气卡片 === */
.weather-card {
  margin: -0.9rem 0.8rem 1rem;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 0.9rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  position: relative;
  z-index: 1;
  border: 0.055rem solid var(--hairline);
}
.weather-card .icon { font-size: 2.4rem; line-height: 1; }
.weather-card .info { flex: 1; }
.weather-card .temp { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
.weather-card .desc { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.15rem; line-height: 1.6; }

/* === 地图 === */
.map-section {
  margin: 0 0.8rem 1rem;
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  border: 0.055rem solid var(--hairline);
  box-shadow: var(--shadow-sm);
}
.map-section img { width: 100%; display: block; }
.map-section a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.56rem;
  padding: 0.4rem 0.8rem;
  background: var(--sky);
  color: #fff;
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 600;
}
.map-section a:hover { background: #2d73b0; }

/* === 预算切换（分段控件风，逻辑不变） === */
.budget-bar {
  margin: 0 0.8rem 1rem;
  display: flex;
  gap: 0.25rem;
  background: #EFEEEA;
  border-radius: 0.9rem;
  padding: 0.25rem;
}
.budget-bar button {
  flex: 1;
  min-height: 2.56rem;
  padding: 0.35rem 0.3rem;
  border: none;
  border-radius: 0.68rem;
  background: transparent;
  font-size: 0.95rem;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-secondary);
  font-family: inherit;
}
.budget-bar button:hover { color: var(--accent); }
.budget-bar button.active-budget {
  background: var(--card-bg);
  color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.budget-static {
  margin: 0 0.8rem 1rem;
  min-height: 2.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card-bg);
  border: 0.055rem solid var(--hairline);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-secondary);
}

/* === 「进行中」卡（仅当天行程出现） === */
.now-card {
  margin: 0 0.8rem 1rem;
  background: var(--card-bg);
  border: 0.055rem solid var(--accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 0.75rem 0.9rem 0.9rem;
}
.now-main { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.now-tag {
  background: var(--accent);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: 0.8rem;
  padding: 0.08rem 0.55rem;
}
.now-time { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
.now-title { font-size: 1rem; font-weight: 600; }
.now-next { font-size: 0.88rem; color: var(--muted-dark); margin-top: 0.3rem; }

/* === sticky 日锚点条（≥2 天时出现） === */
.day-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.45rem 0.8rem;
  margin-bottom: 0.9rem;
  background: var(--bg);
  border-bottom: 0.055rem solid var(--hairline);
  box-shadow: 0 0.11rem 0.33rem rgba(26,26,24,.04);
}
.day-nav a {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  min-height: 2.45rem;
  padding: 0.2rem 0.75rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-decoration: none;
  background: var(--card-bg);
  border: 0.055rem solid var(--border);
  border-radius: 1.2rem;
  white-space: nowrap;
}
.day-nav a.active-day {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* === 分区标题（单日退化样式） === */
.section-title {
  margin: 0 0.8rem 0.55rem;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--muted-dark);
  letter-spacing: 0.05em;
}
/* 章节式大标题（餐厅总览：hairline + 衬线标题，无 Day 圆徽） */
.chapter-title {
  margin: 2.6rem 0.8rem 1rem;
  padding-top: 1.5rem;
  border-top: 0.055rem solid var(--hairline);
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}

/* === 日章节 === */
.day-chapter {
  margin-top: 2.6rem;
  padding-top: 1.5rem;
  border-top: 0.055rem solid var(--hairline);
  scroll-margin-top: 3.5rem;
}
.day-chapter:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.day-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0.8rem 1.1rem;
  flex-wrap: wrap;
}
.day-num {
  flex: 0 0 auto;
  width: 2.6rem;
  height: 2.6rem;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-family: var(--serif);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.15;
  box-shadow: var(--shadow-sm);
}
.day-num .dn-label { font-size: 0.5rem; letter-spacing: 0.14em; opacity: .88; }
.day-num .dn-num { font-size: 1.1rem; font-weight: 700; }
.day-head-text { flex: 1; min-width: 8rem; }
.day-title { font-size: 1.1rem; font-weight: 700; line-height: 1.45; }
.day-theme { font-size: 0.95rem; color: var(--text-secondary); margin-top: 0.08rem; }
.day-weather {
  font-size: 0.8rem;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 0.15rem 0.65rem;
  border-radius: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
}

/* === 时间线 === */
.timeline { margin: 0 0.8rem 1.2rem; position: relative; }
.day-chapter .timeline { margin-bottom: 0; }
.timeline::before {
  content: '';
  position: absolute;
  left: 1.4rem;
  top: 0.3rem;
  bottom: 0.3rem;
  width: 0.11rem;
  background: var(--border);
  border-radius: 0.06rem;
}
.timeline-item {
  position: relative;
  padding-left: 3.2rem;
  margin-bottom: 1.5rem;
}
.timeline-item:last-child { margin-bottom: 0; }
/* 类型图标方块：2.4rem 见方、类型色 12% 底（inset 染色 + 外圈底色盖住轴线） */
.timeline-item .type-icon {
  position: absolute;
  left: 0.26rem;
  top: 0;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 0.7rem;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  line-height: 1;
  z-index: 1;
  box-shadow: inset 0 0 0 3rem rgba(58,125,104,.12), 0 0 0 0.22rem var(--bg);
}
.timeline-item.transport .type-icon { box-shadow: inset 0 0 0 3rem rgba(59,135,204,.12), 0 0 0 0.22rem var(--bg); }
.timeline-item.food .type-icon      { box-shadow: inset 0 0 0 3rem rgba(212,146,10,.12), 0 0 0 0.22rem var(--bg); }
.timeline-item.sight .type-icon     { box-shadow: inset 0 0 0 3rem rgba(58,125,104,.12), 0 0 0 0.22rem var(--bg); }
.timeline-item.break .type-icon     { box-shadow: inset 0 0 0 3rem rgba(143,143,141,.14), 0 0 0 0.22rem var(--bg); }
.timeline-item .time-label {
  font-size: 1rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-bottom: 0.15rem;
}
.timeline-item.transport .time-label { color: var(--sky); }
.timeline-item.food .time-label      { color: var(--amber-dark); }
.timeline-item.sight .time-label     { color: var(--accent); }
.timeline-item.break .time-label     { color: var(--muted-dark); }
.timeline-item .item-title {
  font-size: 1.12rem;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 0.15rem;
  text-wrap: balance;
}
.timeline-item .item-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.75;
  margin-top: 0.2rem;
}
.timeline-item .item-address {
  font-size: 0.85rem;
  color: var(--muted-dark);
  margin-top: 0.3rem;
  line-height: 1.7;
}
.timeline-item .badge, .timeline-item .feature-tag { font-size: 0.78rem; }

/* 「进行中」高亮 */
.timeline-item.active-now {
  background: var(--accent-soft);
  border-left: 0.17rem solid var(--accent);
  border-radius: 0.5rem;
  margin-left: -0.75rem;
  padding-left: 3.95rem;
  padding-right: 0.5rem;
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}
.timeline-item.active-now .type-icon { left: 1.01rem; }
.now-badge {
  display: inline-block;
  margin-left: 0.4rem;
  background: var(--accent);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 0.8rem;
  padding: 0.05rem 0.5rem;
  vertical-align: 0.1rem;
}

/* === 徽章行（人均/评分/特性胶囊） === */
.badge-row {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-top: 0.4rem;
}
.badge {
  font-size: 0.82rem;
  padding: 0.1rem 0.55rem;
  border-radius: 1rem;
  font-weight: 600;
  white-space: nowrap;
}
.badge-score { background: var(--amber-soft); color: var(--amber-dark); }
.badge-price { background: #f3f2ef; color: var(--text-secondary); }
.badge-conf-high { background: var(--accent-soft); color: var(--accent); }
.badge-conf-medium { background: var(--amber-soft); color: var(--amber-dark); }
.badge-conf-low { background: var(--red-soft); color: var(--red); }
.feature-row {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
  margin-top: 0.45rem;
}
.feature-tag {
  font-size: 0.8rem;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 0.08rem 0.5rem;
  border-radius: 0.9rem;
  font-weight: 500;
}

/* === 证据折叠（为什么推荐） === */
details.evidence { margin-top: 0.55rem; }
details.evidence summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  min-height: 2.45rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted-dark);
}
details.evidence summary::-webkit-details-marker { display: none; }
details.evidence summary::after {
  content: '\25BE';
  color: var(--muted);
  transition: transform .18s ease;
}
details.evidence[open] summary::after { transform: rotate(180deg); }
details.evidence .agg-card { margin-top: 0.1rem; }

/* === 聚合卡片 === */
.agg-card {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  border: 0.055rem solid var(--hairline);
  padding: 0.55rem 0.7rem;
  margin-top: 0.5rem;
}
.agg-card .source-row {
  display: flex;
  align-items: flex-start;
  gap: 0.45rem;
  padding: 0.3rem 0;
  border-bottom: 0.055rem solid var(--hairline);
  font-size: 0.9rem;
  line-height: 1.6;
}
.agg-card .source-row:last-child { border-bottom: none; }
.agg-card .source-icon {
  font-size: 0.9rem;
  min-width: 1.1rem;
  text-align: center;
  color: var(--muted);
}
.agg-card .source-content { flex: 1; }
.agg-card .source-stats {
  font-size: 0.82rem;
  color: var(--muted-dark);
  white-space: nowrap;
}

/* === 主操作：大号导航按钮 === */
.navi-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.56rem;
  margin-top: 0.6rem;
  padding: 0.3rem 1rem;
  background: var(--accent);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 0.6rem;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
}
.navi-btn:hover { background: var(--accent-hover); }
.navi-btn:active { transform: scale(0.98); }

/* === 链接胶囊行 === */
.link-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.6rem;
  flex-wrap: wrap;
}
.link-row a {
  font-size: 0.85rem;
  min-height: 2.25rem;
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 1rem;
  border-radius: 1.2rem;
  text-decoration: none;
  font-weight: 600;
}
.link-row a:active { transform: scale(0.97); }
.link-dianping { background: var(--accent-soft); color: var(--accent); }
.link-bilibili { background: #fde8ee; color: #d44a6e; }
.link-xhs { background: #ffe8e8; color: #d43939; }

/* === 餐厅卡片流 === */
.restaurant-list {
  margin: 0 0.8rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.rest-card {
  background: var(--card-bg);
  border: 0.055rem solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 0.9rem 1rem;
}
.rest-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.6rem;
}
.rest-name { font-size: 1.1rem; font-weight: 700; line-height: 1.5; }
.rest-meta { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.35rem; }
.rest-address { font-size: 0.9rem; color: var(--muted-dark); margin-top: 0.15rem; }

/* === 页脚 === */
footer {
  margin: 2.2rem 0.8rem 6.5rem;
  padding-top: 0.9rem;
  text-align: center;
  font-size: 0.82rem;
  color: var(--muted-dark);
  border-top: 0.055rem solid var(--hairline);
  line-height: 1.8;
}

/* === 浮动按钮 === */
.float-btn {
  position: fixed;
  right: 0.9rem;
  z-index: 60;
  width: 3rem;
  height: 3rem;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0.22rem 0.67rem rgba(26,26,24,.22);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: inherit;
  line-height: 1.1;
}
.float-btn:hover { background: var(--accent-hover); }
.float-btn:active { transform: scale(0.95); }
#font-switch { bottom: 1.1rem; }
#font-switch .aa { font-size: 1.05rem; font-weight: 700; }
#font-switch .ft-label { font-size: 0.72rem; opacity: .92; }
#back-top { bottom: 4.5rem; font-size: 1.3rem; display: none; }

/* === 09-06 产品审查批次：时长徽章 / 双向锚点 / Plan B / 天气折叠 / 预算切换反馈 === */
.dur-badge {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--muted-dark);
  background: var(--hairline);
  border-radius: 0.8rem;
  padding: 0.05rem 0.5rem;
  vertical-align: 0.08rem;
  white-space: nowrap;
}
.link-torest { background: var(--sky-soft); color: var(--sky); }
.back-link {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--sky);
  text-decoration: none;
  margin-left: 0.5rem;
  white-space: nowrap;
}
.alt-card { border-left: 0.17rem solid var(--amber); }
.alt-when {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--amber-dark);
  background: var(--amber-soft);
  border-radius: 0.8rem;
  padding: 0.08rem 0.55rem;
  margin-top: 0.3rem;
}
.weather-more { margin-top: 0.25rem; }
.weather-more summary {
  font-size: 0.85rem;
  color: var(--sky);
  cursor: pointer;
  list-style: none;
  min-height: 1.8rem;
}
.weather-more summary::-webkit-details-marker { display: none; }
.weather-more summary::after { content: ' ▾'; }
.weather-more[open] summary::after { content: ' ▴'; }
.tier-flash { animation: tierFlash 1.2s ease; border-radius: 0.5rem; }
@keyframes tierFlash {
  0% { background: var(--amber-soft); }
  100% { background: transparent; }
}
.copy-addr {
  font-size: 0.85rem;
  min-height: 2.25rem;
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 1rem;
  border-radius: 1.2rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: 0.055rem solid var(--border);
  background: var(--card-bg);
  color: var(--text-secondary);
}
.copy-addr:active { transform: scale(0.97); }
.offline-note { margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); }

/* === 描述结构化（09-06 三轮审查）：结论卡 / 注意卡 / 紧凑 bullet / 折叠详情 / 照片条 === */
.tip-callout, .warn-callout {
  font-size: 0.9rem;
  line-height: 1.65;
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.7rem;
  margin-top: 0.4rem;
}
.tip-callout { background: var(--accent-soft); color: var(--text); }
.tip-callout::before { content: '💡 '; }
.warn-callout { background: var(--amber-soft); color: var(--text); }
.warn-callout::before { content: '⚠️ '; }
.hl-list, .desc-bullets {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-top: 0.3rem;
  padding-left: 1.1rem;
}
.hl-list { color: var(--text); }
.hl-list li::marker { color: var(--accent); }
.desc-bullets li::marker { color: var(--muted); }
.desc-more { margin-top: 0.35rem; }
.desc-more summary {
  font-size: 0.85rem;
  color: var(--sky);
  cursor: pointer;
  list-style: none;
  min-height: 1.8rem;
  font-weight: 600;
}
.desc-more summary::-webkit-details-marker { display: none; }
.desc-more summary::after { content: ' ▾'; }
.desc-more[open] summary::after { content: ' ▴'; }

/* === 内容丰富化（09-06）：实用信息块 / 怎么玩 / 带娃 / 真实声音 === */
.info-grid { margin-top: 0.5rem; border-top: 1px dashed var(--hairline); padding-top: 0.4rem; }
.info-row { display: flex; gap: 0.45rem; font-size: 0.85rem; line-height: 1.65; margin-top: 0.15rem; }
.info-row .info-ico { flex: 0 0 auto; }
.info-row .info-label { flex: 0 0 auto; color: var(--muted); }
.info-row .info-val { flex: 1; color: var(--text-secondary); }
.play-guide { margin-top: 0.55rem; }
.play-guide .pg-label { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
.play-guide ol { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; margin: 0.25rem 0 0; padding-left: 1.2rem; }
.play-guide li::marker { color: var(--accent); font-weight: 600; }
.kid-line { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.45rem; background: var(--accent-soft); border-radius: var(--radius-sm); padding: 0.4rem 0.65rem; line-height: 1.6; }
.voice-card { font-size: 0.85rem; line-height: 1.6; margin-top: 0.35rem; padding: 0.4rem 0.65rem; border-left: 3px solid var(--hairline); color: var(--text-secondary); }
.voice-card.good { border-left-color: var(--accent); }
.voice-card.bad { border-left-color: var(--amber); }
.voice-card .voice-src { color: var(--muted); font-size: 0.78rem; }
.photo-strip {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0.45rem 0 0.1rem;
  scroll-snap-type: x mandatory;
}
.photo-strip img {
  flex: 0 0 auto;
  width: 8.2rem;
  height: 6.2rem;
  object-fit: cover;
  border-radius: var(--radius-sm);
  scroll-snap-align: start;
  background: var(--hairline);
}

/* === 响应式 === */
@media (min-width: 35.6rem) {
  body { padding: 0 0 2.2rem; }
  header { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
}
</style>

<body>

<header id="cover" class="cover-default">
  <h1 id="trip-title">旅行攻略</h1>
  <div class="subtitle" id="trip-subtitle" style="display:none"></div>
  <div class="meta" id="trip-meta"></div>
</header>

<div id="weather-card" class="weather-card" style="display:none"></div>

<div id="map-section" class="map-section" style="display:none"></div>

<div id="budget-bar" style="display:none"></div>

<div id="now-card" class="now-card" style="display:none"></div>

<nav id="day-nav" class="day-nav" style="display:none" aria-label="日期导航"></nav>

<div class="section-title" id="timeline-section-title" style="display:none">📅 行程安排</div>
<div id="timeline"></div>

<div class="section-title chapter-title" id="restaurant-section-title" style="display:none">🍜 餐厅总览</div>
<div id="restaurant-list" class="restaurant-list"></div>

<div class="section-title chapter-title" id="alt-section-title" style="display:none">🌂 Plan B · 备选方案</div>
<div id="alt-list" class="restaurant-list"></div>

<footer>
  <div id="footer-sources" style="display:none">信息来源 &middot; <span id="source-list"></span></div>
  <div id="gen-time"></div>
  <div class="offline-note">本页为自包含文件，无网可读 · 建议微信浮窗/收藏</div>
</footer>

<button id="back-top" class="float-btn" onclick="scrollTop()" aria-label="回到顶部">&#8593;</button>
<button id="font-switch" class="float-btn" onclick="cycleFontSize()" aria-label="切换字号"><span class="aa">Aa</span><span class="ft-label" id="font-label">标准</span></button>

<script>
var TRIP_DATA = __TRIP_DATA__;
var currentBudget = 'economy';
/* 微信 WebView 无法可靠唤起导航 App（行业实测+高德官方文档）：微信内 navi 降级为
   「打开地图」（uri.amap.com 网页版可用），浏览器内为「导航去这里」（自动唤起 App） */
var IS_WECHAT = /micromessenger/i.test(navigator.userAgent || '');

/* ---------- 小工具 ---------- */
function $(id) { return document.getElementById(id); }

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function fmtNow() {
  var n = new Date();
  return n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(n.getDate()) +
    ' ' + pad2(n.getHours()) + ':' + pad2(n.getMinutes());
}

function fmtDuration(min) {
  var m = parseInt(min, 10);
  if (isNaN(m) || m <= 0) return '';
  if (m >= 60) {
    var h = Math.floor(m / 60);
    var r = m % 60;
    return h + '小时' + (r ? r + '分钟' : '');
  }
  return m + '分钟';
}

/* 评价数格式化：12000 → 1.2万条评价；485 → 485条评价 */
function fmtReviews(n) {
  if (n === null || n === undefined || n === '') return '';
  var num = parseFloat(n);
  if (isNaN(num)) return '';
  if (num >= 10000) return (Math.round(num / 1000) / 10) + '万条评价';
  return num + '条评价';
}

/* 播放量格式化：3200727 → 320万次播放 */
function fmtViews(n) {
  var num = parseFloat(n);
  if (isNaN(num) || !num) return '';
  return Math.round(num / 10000) + '万次播放';
}

function getWeatherIcon(condition) {
  var c = condition || '';
  if (c.indexOf('晴') >= 0) return '☀';
  if (c.indexOf('多云') >= 0) return '⛅';
  if (c.indexOf('阴') >= 0) return '☁';
  if (c.indexOf('雨') >= 0) return '🌧';
  if (c.indexOf('雪') >= 0) return '❄';
  return '🌤';
}

/* ---------- 预算（三档 / 单一 / 无） ---------- */
function getBudgetTiers(bg) {
  if (!bg) return null;
  var tight = (bg.food_per_person_tight != null && bg.food_per_person_tight !== '') ? bg.food_per_person_tight : bg.economy;
  var comfort = (bg.food_per_person_comfort != null && bg.food_per_person_comfort !== '') ? bg.food_per_person_comfort : bg.standard;
  var premium = (bg.food_per_person_premium != null && bg.food_per_person_premium !== '') ? bg.food_per_person_premium : bg.premium;
  if (tight != null && tight !== '' && comfort != null && comfort !== '' && premium != null && premium !== '') {
    return [tight, comfort, premium];
  }
  return null;
}

function getSingleBudget(bg) {
  if (!bg) return '';
  if (bg.food_per_person != null && bg.food_per_person !== '') return bg.food_per_person;
  if (bg.per_person_total != null && bg.per_person_total !== '') return bg.per_person_total;
  return '';
}

function getBudgetFoodPrice(budget, level) {
  if (!budget) return '';
  if (level === 'economy') return budget.food_per_person_tight || budget.economy || '';
  if (level === 'standard') return budget.food_per_person_comfort || budget.standard || '';
  if (level === 'premium') return budget.food_per_person_premium || budget.premium || '';
  return budget.food_per_person || '';
}

function getTierProp(item, prop) {
  if (!item.tiers) return null;
  var tier = item.tiers[currentBudget];
  return tier ? tier[prop] : null;
}

function aggRow(icon, content) {
  return '<div class="source-row"><span class="source-icon">' + icon + '</span>' +
    '<span class="source-content">' + content + '</span></div>';
}

/* ---------- 日章节工具 ---------- */
/* day 文本按「·」防御式 split：前段=日期星期、后段=主题；无「·」整串作标题 */
function splitDay(dayText) {
  var s = String(dayText || '');
  var idx = s.indexOf('·');
  if (idx < 0) return { head: s.replace(/^\s+|\s+$/g, ''), theme: '' };
  return {
    head: s.slice(0, idx).replace(/^\s+|\s+$/g, ''),
    theme: s.slice(idx + 1).replace(/^\s+|\s+$/g, '')
  };
}

/* 锚点文案：DayN·日期（日期从前段提取 M/D，失败则只用 DayN） */
function dayAnchorLabel(n, head) {
  var datePart = '';
  var m = /(\d{1,2}\/\d{1,2})/.exec(head || '');
  if (m) datePart = m[1];
  return 'Day' + n + (datePart ? '·' + datePart : '');
}

/* 按 item.day 连续分组 */
function buildDayGroups(tl) {
  var groups = [];
  for (var i = 0; i < tl.length; i++) {
    var item = tl[i];
    var day = item.day || '';
    var last = groups.length ? groups[groups.length - 1] : null;
    if (last && day === last.day) {
      last.items.push(item);
    } else {
      groups.push({ day: day, weather: item.day_weather || '', items: [item] });
    }
  }
  return groups;
}

function uniqueDayCount(groups) {
  var seen = {};
  var n = 0;
  for (var i = 0; i < groups.length; i++) {
    var d = groups[i].day;
    if (d && !seen[d]) { seen[d] = 1; n++; }
  }
  return n;
}

/* ---------- 行程项渲染 ---------- */
/* ---------- 行程项描述：句子级结构化（09-06 三轮产品审查：大段文字决策成本高） ----------
 * 生成方写的是叙述散文，但决策需要的是分级信息：
 *   💡 句 → 苔绿「结论卡」（核实结论/建议动作）
 *   ⚠️ 句 → 琥珀「注意卡」（风险/营业时间/天气影响）
 *   其余 → 紧凑 bullet；超 120 字时 bullet 折叠进「详情」
 * 有 highlights/tips 结构化字段时优先生效，description 整体降级为「完整说明」折叠。 */
function splitSentences(s) {
  return String(s || '').match(/[^。；!！?？]+[。；!！?？]?/g) || [];
}

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function descHtml(item) {
  var desc = String(item.description || '');
  var hl = item.highlights || [];
  var tips = item.tips || [];
  var html = '';

  // 结构化 highlights：决策要点直接成 bullet（最高优先）
  if (hl.length) {
    html += '<ul class="hl-list">' + hl.map(function (h) {
      return '<li>' + h + '</li>';
    }).join('') + '</ul>';
  }
  // 结构化 tips → 注意卡
  for (var ti = 0; ti < tips.length; ti++) {
    html += '<div class="warn-callout">' + tips[ti] + '</div>';
  }

  // 散文兜底：句子级分类
  var rest = '';
  if (desc) {
    var sens = splitSentences(desc);
    var callouts = '';
    var bullets = [];
    for (var i = 0; i < sens.length; i++) {
      var s = sens[i].replace(/^\s+|\s+$/g, '');
      if (!s) continue;
      s = s.replace(/\*\*/g, ''); // 生成方散文常带 markdown 加粗标记，页面非 md 渲染会露出星号
      if (s.indexOf('⚠️') >= 0) {
        callouts += '<div class="warn-callout">' + s.replace(/^⚠️\s*/, '') + '</div>';
      } else if (s.indexOf('💡') >= 0) {
        callouts += '<div class="tip-callout">' + s.replace(/^💡\s*/, '') + '</div>';
      } else {
        bullets.push(s);
      }
    }
    if (bullets.length) {
      var bl = '<ul class="desc-bullets">' + bullets.map(function (b) {
        return '<li>' + b + '</li>';
      }).join('') + '</ul>';
      // 折叠规则：有结构化字段时 description 全折；否则 bullet 总长大于阈值才折
      var bulletLen = bullets.join('').length;
      var foldLabel = hl.length ? '完整说明' : '详情';
      if (hl.length || (bulletLen > 120 && bullets.length > 1)) {
        bl = '<details class="desc-more"><summary>' + foldLabel + ' · ' + bullets.length + ' 条</summary>' + bl + '</details>';
      }
      rest = callouts + bl;
    } else {
      rest = callouts;
    }
  }
  return html + rest;
}

/* 照片条：横向滑动、懒加载、加载失败静默移除（图源防盗链是常态，纯增强不阻塞） */
function photosHtml(item) {
  var ph = item.photos || [];
  if (!ph.length) return '';
  var imgs = '';
  for (var i = 0; i < ph.length; i++) {
    imgs += '<img src="' + escAttr(ph[i]) + '" loading="lazy" referrerpolicy="no-referrer" ' +
      'alt="" onerror="this.remove()">';
  }
  return '<div class="photo-strip">' + imgs + '</div>';
}

/* 实用信息块：营业时间/门票/预约/停车/人流——自驾+带娃的硬信息（09-06 内容丰富化） */
function infoHtml(item) {
  var info = item.info || {};
  var defs = [
    ['hours', '🕐', '营业'],
    ['ticket', '🎫', '门票'],
    ['reservation', '📱', '预约'],
    ['parking', '🅿️', '停车'],
    ['crowd', '👥', '人流']
  ];
  var rows = '';
  for (var i = 0; i < defs.length; i++) {
    var v = info[defs[i][0]];
    if (!v) continue;
    rows += '<div class="info-row"><span class="info-ico">' + defs[i][1] + '</span>' +
      '<span class="info-label">' + defs[i][2] + '</span>' +
      '<span class="info-val">' + v + '</span></div>';
  }
  return rows ? '<div class="info-grid">' + rows + '</div>' : '';
}

/* 怎么玩/怎么吃：动线、必看点、推荐菜——与 highlights（选不选它）互补（09-06） */
function playGuideHtml(item) {
  var pg = item.play_guide || [];
  if (!pg.length) return '';
  return '<div class="play-guide"><div class="pg-label">🧭 怎么玩</div><ol>' +
    pg.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>';
}

/* 带娃适配一行：推车/母婴室/适龄/午睡兼容（09-06） */
function kidHtml(item) {
  if (!item.kid) return '';
  return '<div class="kid-line">👶 ' + item.kid + '</div>';
}

/* 真实声音：一好一差两条代表性实评（带来源，比评分数字立体）（09-06） */
function voicesHtml(item) {
  var vs = item.voices || [];
  if (!vs.length) return '';
  var html = '';
  for (var i = 0; i < vs.length; i++) {
    var v = vs[i];
    if (!v || !v.quote) continue;
    var tone = v.tone === 'bad' ? 'bad' : 'good';
    html += '<div class="voice-card ' + tone + '">&ldquo;' + v.quote + '&rdquo;' +
      (v.source ? ' <span class="voice-src">— ' + v.source + '</span>' : '') + '</div>';
  }
  return html;
}

function itemHtml(item) {
  // 聚合口碑：各字段缺失时跳过对应行；整体折叠进「为什么推荐」
  var aggHtml = '';
  if (item.aggregation) {
    var ag = item.aggregation;
    var rows = '';
    if (ag.primary && ag.primary.dianping_score) {
      var pv = fmtReviews(ag.primary.dianping_reviews);
      rows += aggRow('&starf;', (ag.primary.name || '') + ' &middot; 评分 ' + ag.primary.dianping_score +
        (pv ? ' &middot; ' + pv : ''));
    }
    if (ag.dianping && ag.dianping.score) {
      var dp = ag.dianping;
      var subs = [];
      if (dp.taste != null) subs.push('口味 ' + dp.taste);
      if (dp.environment != null) subs.push('环境 ' + dp.environment);
      if (dp.service != null) subs.push('服务 ' + dp.service);
      var dpLine = '点评：' + dp.score + (subs.length ? '（' + subs.join(' / ') + '）' : '');
      var dr = fmtReviews(dp.reviews);
      if (dr) dpLine += ' &middot; ' + dr;
      rows += aggRow('&starf;', dpLine);
    }
    if (ag.bilibili_quotes && ag.bilibili_quotes.length) {
      var quotes = ag.bilibili_quotes.map(function (q) { return '&ldquo;' + q + '&rdquo;'; }).join(' ');
      var views = fmtViews(ag.bilibili_views);
      rows += '<div class="source-row"><span class="source-icon">&#9654;</span>' +
        '<span class="source-content">' + quotes + '</span>' +
        (views ? '<span class="source-stats">' + views + '</span>' : '') + '</div>';
    }
    if (ag.alternatives && ag.alternatives.length) {
      rows += aggRow('&diams;', '备选：' + ag.alternatives.map(function (a) {
        return a.name + (a.dianping_score ? '（' + a.dianping_score + '）' : '');
      }).join('、'));
    }
    if (ag.xhs_likes) {
      rows += aggRow('&sect;', '小红书：' + ag.xhs_likes + ' 人推荐');
    }
    if (rows) {
      // hook：折叠入口直接亮出最强信号（09-06 产品审查：多源交叉验证是核心资产，不应全藏）
      var hookParts = [];
      if (ag.primary && ag.primary.dianping_score) hookParts.push('★' + ag.primary.dianping_score);
      else if (ag.dianping && ag.dianping.score) hookParts.push('点评 ' + ag.dianping.score);
      if (ag.bilibili_views) hookParts.push('B站 ' + fmtViews(ag.bilibili_views));
      if (ag.xhs_likes) hookParts.push('小红书 ' + ag.xhs_likes + ' 赞');
      aggHtml = '<details class="evidence"><summary>为什么推荐' +
        (hookParts.length ? ' · ' + hookParts.slice(0, 3).join(' · ') : '') +
        '</summary>' +
        '<div class="agg-card">' + rows + '</div></details>';
    }
  }

  // 主操作：大号导航按钮（navi_url 或 links.amap_navi）+ 平台链接胶囊
  var links = item.links || {};
  var naviUrl = links.amap_navi || item.navi_url || '';
  var actionHtml = '';
  if (naviUrl) {
    actionHtml += '<a class="navi-btn" href="' + naviUrl + '" target="_blank" rel="noopener">' +
      (IS_WECHAT ? '🧭 打开地图' : '🧭 导航去这里') + '</a>';
  }
  var pills = '';
  // 司机场景刚需：地址一键复制（微信内粘到高德搜索框是最可靠的兜底路径）；
  // address 缺失时回退 location.name（真实数据 0/7 项有 address——字段约定未落实）
  var addrText = item.address || (item.location && item.location.name) || '';
  if (addrText) {
    pills += '<button type="button" class="copy-addr" data-addr="' +
      String(addrText).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') +
      '">📋 复制地址</button>';
  }
  if (links.dianping) pills += '<a class="link-dianping" href="' + links.dianping + '" target="_blank" rel="noopener">点评</a>';
  if (links.dianping_wang) pills += '<a class="link-dianping" href="' + links.dianping_wang + '" target="_blank" rel="noopener">点评</a>';
  if (links.bilibili) pills += '<a class="link-bilibili" href="' + links.bilibili + '" target="_blank" rel="noopener">B站</a>';
  if (links.xhs) pills += '<a class="link-xhs" href="' + links.xhs + '" target="_blank" rel="noopener">小红书</a>';
  // food 项 ↔ 餐厅总览双向锚点（09-06 产品审查：到饭点看时间线时必须一键到选餐厅区）
  if (item.type === 'food' && (TRIP_DATA.restaurants || []).length) {
    pills += '<a class="link-torest" href="#restaurant-section-title">↓ 选餐厅</a>';
  }
  if (pills) actionHtml += '<div class="link-row">' + pills + '</div>';

  // 徽章行：人均¥X / ★评分 / features 胶囊
  var badges = '';
  var ppp = getTierProp(item, 'price') || item.price_per_person;
  if (ppp) badges += '<span class="badge badge-price">人均 &yen;' + ppp + '</span>';
  if (item.rating && item.rating.amap) badges += '<span class="badge badge-score">&starf; ' + item.rating.amap + '</span>';
  if (item.features && item.features.length) {
    for (var i = 0; i < item.features.length; i++) {
      badges += '<span class="feature-tag">' + item.features[i] + '</span>';
    }
  }

  var tierName = getTierProp(item, 'name');
  var displayTitle = tierName ? (item.title + ' &rarr; ' + tierName) : item.title;

  return '<div class="timeline-item ' + (item.type || '') + '">' +
    '<div class="type-icon">' + (item.icon || '●') + '</div>' +
    '<div class="time-label">' + (item.time || '') +
      (item.duration_min ? ' <span class="dur-badge">约' + fmtDuration(item.duration_min) + '</span>' : '') + '</div>' +
    '<div class="item-title">' + displayTitle + '</div>' +
    photosHtml(item) +
    descHtml(item) +
    playGuideHtml(item) +
    voicesHtml(item) +
    (badges ? '<div class="badge-row">' + badges + '</div>' : '') +
    kidHtml(item) +
    infoHtml(item) +
    (item.address ? '<div class="item-address">📍 ' + item.address + '</div>' : '') +
    actionHtml + aggHtml +
    '</div>';
}

function itemsHtml(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) html += itemHtml(items[i]);
  return html;
}

/* ---------- 主渲染 ---------- */
function render() {
  var d = TRIP_DATA || {};
  var t = d.trip || {};
  var w = t.weather || {};
  var tr = t.transport || {};
  var bg = t.budget || {};

  // 标题
  if (t.title) {
    $('trip-title').textContent = t.title;
    document.title = t.title;
  }

  // 副标题（可选）
  var subEl = $('trip-subtitle');
  if (t.subtitle) {
    subEl.textContent = t.subtitle;
    subEl.style.display = '';
  } else {
    subEl.style.display = 'none';
  }

  // 封面渐变：按天气 condition 映射（含晴→暖琥 / 含雨→天蓝灰 / 其他→苔绿）
  var cond = w.condition || '';
  var coverClass = 'cover-default';
  if (cond.indexOf('晴') >= 0) coverClass = 'cover-sunny';
  else if (cond.indexOf('雨') >= 0) coverClass = 'cover-rainy';
  $('cover').className = coverClass;

  // 封面徽章行：日期范围 / 天气摘要 / 交通摘要 / 餐饮人均，缺失字段跳过
  var tiers = getBudgetTiers(bg);
  var singleBudget = getSingleBudget(bg);
  var metaHtml = '';
  if (t.date) metaHtml += '<span>' + t.date + '</span>';
  var wSpan = '';
  if (w.condition) wSpan += w.condition;
  if (w.temp_high != null && w.temp_low != null) {
    wSpan += (wSpan ? ' ' : '') + w.temp_high + '&deg; / ' + w.temp_low + '&deg;';
  }
  if (wSpan) metaHtml += '<span>' + wSpan + '</span>';
  var od = '';
  if (tr.origin && tr.destination) od = tr.origin + ' &rarr; ' + tr.destination;
  else if (tr.origin || tr.destination) od = tr.origin || tr.destination;
  var dd = '';
  if (tr.distance_km) dd += tr.distance_km + 'km';
  var dur = fmtDuration(tr.duration_min);
  if (dur) dd += (dd ? ' / ' : '') + dur;
  var trSpan = tr.mode ? tr.mode : '';
  if (od) trSpan += (trSpan ? ' &middot; ' : '') + od;
  if (dd) trSpan += (trSpan ? ' &middot; ' : '') + dd;
  if (trSpan) metaHtml += '<span>' + trSpan + '</span>';
  var budgetPrice = tiers ? getBudgetFoodPrice(bg, currentBudget) : singleBudget;
  if (budgetPrice !== '' && budgetPrice != null) {
    var bLabel = (!tiers && bg.per_person_total != null && bg.food_per_person == null) ? '人均 &yen;' : '餐饮人均 &yen;';
    metaHtml += '<span>' + bLabel + budgetPrice + '</span>';
  }
  $('trip-meta').innerHTML = metaHtml;

  // 天气卡片（缺天气则整体隐藏）
  var wc = $('weather-card');
  if (w.condition || w.temp_high != null) {
    wc.style.display = '';
    var tempLine = '';
    if (w.condition) tempLine += w.condition;
    if (w.temp_high != null && w.temp_low != null) {
      tempLine += (tempLine ? ' &middot; ' : '') + w.temp_high + '&deg;C / ' + w.temp_low + '&deg;C';
    }
    var descParts = [];
    if (w.wind) descParts.push(w.wind);
    if (w.tip) descParts.push(w.tip);
    // 长天气备注折叠（09-06 产品审查：sanya 实例 note 一大段话把天气卡撑成文本块）
    var noteHtml = '';
    if (w.note) {
      if (w.note.length > 40) {
        noteHtml = '<details class="weather-more"><summary>天气详情</summary><div class="desc">' + w.note + '</div></details>';
      } else {
        descParts.push(w.note);
      }
    }
    wc.innerHTML =
      '<div class="icon">' + getWeatherIcon(w.condition) + '</div>' +
      '<div class="info">' +
        '<div class="temp">' + tempLine + '</div>' +
        (descParts.length ? '<div class="desc">' + descParts.join(' &middot; ') + '</div>' : '') +
        noteHtml +
      '</div>';
  } else {
    wc.style.display = 'none';
  }

  // 地图区（static_url 与 navi_url 都空则整体隐藏）
  var rm = d.route_map || {};
  var mapEl = $('map-section');
  if (rm.static_url || rm.navi_url) {
    mapEl.style.display = '';
    mapEl.innerHTML =
      (rm.static_url ? '<img src="' + rm.static_url + '" alt="路线图" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      (rm.navi_url ? '<a href="' + rm.navi_url + '" target="_blank" rel="noopener">打开高德地图导航 ↗</a>' : '');
  } else {
    mapEl.style.display = 'none';
  }

  // 预算区：三档分段控件 / 单一静态文本 / 整体隐藏
  var bb = $('budget-bar');
  if (tiers) {
    bb.className = 'budget-bar';
    bb.style.display = '';
    var keys = ['economy', 'standard', 'premium'];
    var names = ['经济版', '标准版', '品质版'];
    var btns = '';
    for (var i = 0; i < keys.length; i++) {
      btns += '<button class="' + (keys[i] === currentBudget ? 'active-budget' : '') +
        '" onclick="switchBudget(\'' + keys[i] + '\')">' + names[i] + ' &yen;' + tiers[i] + '</button>';
    }
    bb.innerHTML = btns;
  } else if (singleBudget !== '') {
    bb.className = 'budget-static';
    bb.style.display = '';
    var sLabel = (bg.per_person_total != null && bg.food_per_person == null) ? '人均 &yen;' : '餐饮人均 &yen;';
    bb.innerHTML = sLabel + singleBudget;
  } else {
    bb.style.display = 'none';
    bb.innerHTML = '';
  }

  // 时间线：≥2 个不同 day 渲染日章节 + 锚点条；否则退化为「📅 行程安排」+ 单时间流
  var tl = d.timeline || [];
  var tlTitle = $('timeline-section-title');
  var tlEl = $('timeline');
  var nav = $('day-nav');
  if (!tl.length) {
    tlTitle.style.display = 'none';
    tlEl.innerHTML = '';
    nav.style.display = 'none';
    nav.innerHTML = '';
  } else {
    var groups = buildDayGroups(tl);
    var multiDay = uniqueDayCount(groups) >= 2;
    tlTitle.style.display = multiDay ? 'none' : '';
    var html = '';
    var navHtml = '';
    if (!multiDay) {
      html = '<div class="timeline">' + itemsHtml(tl) + '</div>';
    } else {
      var seenDay = {};
      var daySeq = 0;
      for (var gi = 0; gi < groups.length; gi++) {
        var g = groups[gi];
        if (!g.day) {
          // 无 day 的分组（防御）：渲染为无章节头的普通时间流
          html += '<div class="timeline">' + itemsHtml(g.items) + '</div>';
          continue;
        }
        var n = 0;
        if (seenDay[g.day]) {
          n = 0; // 同一 day 非连续重复出现：只保留首个章节的锚点
        } else {
          daySeq++;
          seenDay[g.day] = daySeq;
          n = daySeq;
        }
        var parts = splitDay(g.day);
        html += '<section class="day-chapter"' + (n ? ' id="day-' + n + '"' : '') + '>' +
          '<div class="day-head">' +
            '<span class="day-num"><span class="dn-label">DAY</span><span class="dn-num">' + (n || '') + '</span></span>' +
            '<div class="day-head-text">' +
              '<div class="day-title">' + (parts.head || g.day) + '</div>' +
              (parts.theme ? '<div class="day-theme">' + parts.theme + '</div>' : '') +
            '</div>' +
            (g.weather ? '<span class="day-weather">' + g.weather + '</span>' : '') +
          '</div>' +
          '<div class="timeline">' + itemsHtml(g.items) + '</div>' +
          '</section>';
        if (n) navHtml += '<a href="#day-' + n + '">' + dayAnchorLabel(n, parts.head) + '</a>';
      }
    }
    tlEl.innerHTML = html;
    if (navHtml) {
      nav.innerHTML = navHtml;
      nav.style.display = '';
    } else {
      nav.style.display = 'none';
      nav.innerHTML = '';
    }
  }

  // 「进行中」卡（仅 trip.date 为今天时出现；任何异常静默）
  renderNowCard();

  // 餐厅区：纵向卡片流（空数组则连标题整体隐藏）
  var restaurants = d.restaurants || [];
  var rTitle = $('restaurant-section-title');
  var rList = $('restaurant-list');
  if (!restaurants.length) {
    rTitle.style.display = 'none';
    rList.style.display = 'none';
    rList.innerHTML = '';
  } else {
    rTitle.style.display = '';
    rList.style.display = '';
    var cards = '';
    for (var j = 0; j < restaurants.length; j++) {
      var r = restaurants[j];

      var confBadge = '';
      if (r.confidence === 'high') confBadge = '<span class="badge badge-conf-high">置信度高</span>';
      else if (r.confidence === 'medium') confBadge = '<span class="badge badge-conf-medium">置信度中</span>';
      else if (r.confidence === 'low') confBadge = '<span class="badge badge-conf-low">置信度低</span>';

      var badges = '';
      var score = r.rating_amap || r.dianping_score;
      if (score) badges += '<span class="badge badge-score">&starf; ' + score + '</span>';
      if (r.price_per_person) badges += '<span class="badge badge-price">人均 &yen;' + r.price_per_person + '</span>';
      var rReviews = fmtReviews(r.dianping_reviews);
      if (rReviews) badges += '<span class="badge badge-price">' + rReviews + '</span>';

      var dtParts = [];
      if (r.district) dtParts.push(r.district);
      if (r.type) dtParts.push(r.type);

      var rFeat = '';
      if (r.features && r.features.length) {
        rFeat = '<div class="feature-row">' + r.features.map(function (f) {
          return '<span class="feature-tag">' + f + '</span>';
        }).join('') + '</div>';
      }

      var rl = r.links || {};
      var rLinks = '';
      if (rl.dianping) rLinks += '<a class="link-dianping" href="' + rl.dianping + '" target="_blank" rel="noopener">点评</a>';
      if (rl.bilibili) rLinks += '<a class="link-bilibili" href="' + rl.bilibili + '" target="_blank" rel="noopener">B站</a>';
      if (rl.xhs) rLinks += '<a class="link-xhs" href="' + rl.xhs + '" target="_blank" rel="noopener">小红书</a>';

      cards += '<div class="rest-card">' +
        '<div class="rest-head"><div class="rest-name">' + r.name + '</div>' + confBadge + '</div>' +
        (badges ? '<div class="badge-row">' + badges + '</div>' : '') +
        (dtParts.length ? '<div class="rest-meta">' + dtParts.join(' &middot; ') + '</div>' : '') +
        (r.address ? '<div class="rest-address">📍 ' + r.address + '</div>' : '') +
        rFeat +
        (rLinks ? '<div class="link-row">' + rLinks + '</div>' : '') +
        '</div>';
    }
    rList.innerHTML = cards;
    // 餐厅区头部加「回到行程」反链（与 food 项的「↓ 选餐厅」对偶）
    rTitle.innerHTML = '🍜 餐厅总览 · ' + restaurants.length + ' 家' +
      ' <a class="back-link" href="#timeline">↑ 回到行程</a>';
  }

  // Plan B 备选方案（09-06 产品审查：alternatives 之前采了不渲染——雨天/带娃场景 Plan B 是刚需）
  var alts = d.alternatives || [];
  var aTitle = $('alt-section-title');
  var aList = $('alt-list');
  if (!alts.length) {
    aTitle.style.display = 'none';
    aList.style.display = 'none';
    aList.innerHTML = '';
  } else {
    aTitle.style.display = '';
    aList.style.display = '';
    var aCards = '';
    for (var k = 0; k < alts.length; k++) {
      var a = alts[k];
      aCards += '<div class="rest-card alt-card">' +
        '<div class="rest-name">' + (a.name || '') + '</div>' +
        (a.when ? '<div class="alt-when">当「' + a.when + '」时</div>' : '') +
        (a.detail ? '<div class="rest-meta">' + a.detail + '</div>' : '') +
        '</div>';
    }
    aList.innerHTML = aCards;
  }

  // 页脚
  var src = d.sources || [];
  var srcRow = $('footer-sources');
  if (src.length) {
    srcRow.style.display = '';
    $('source-list').textContent = src.join(' · ');
  } else {
    srcRow.style.display = 'none';
  }
  // 生成时间：取 inject 时烙入的 generated_at（数据真实新鲜度），绝不显示"打开时间"——
  // 每次打开都印当下时间会谎称数据新鲜度（09-06 产品审查发现）；旧数据无此字段则如实标注
  if (d.generated_at) {
    $('gen-time').textContent = '数据采集于 ' + d.generated_at;
  } else {
    $('gen-time').textContent = '数据采集时间未知（旧版数据）';
  }

  // scroll-spy（纯增强：无 IntersectionObserver 静默跳过，锚点本身仍可用）
  initScrollSpy();
}

function switchBudget(level) {
  var before = tierSignature();
  currentBudget = level;
  try { localStorage.setItem('tp-budget', level); } catch (e) {}
  render();
  highlightActiveItem(false);
  flashChangedTiers(before);
}

/* 预算档位持久化 + 切换可见反馈（09-06 产品审查：切换后页面几乎不变 → "按了没反应"） */
try {
  var savedBudget = localStorage.getItem('tp-budget');
  if (savedBudget === 'economy' || savedBudget === 'standard' || savedBudget === 'premium') {
    currentBudget = savedBudget;
  }
} catch (e) {}

function tierSignature() {
  var tl = (TRIP_DATA && TRIP_DATA.timeline) || [];
  var sig = [];
  for (var i = 0; i < tl.length; i++) {
    var it = tl[i];
    sig.push((getTierProp(it, 'name') || '') + '|' + (getTierProp(it, 'price') || ''));
  }
  return sig;
}

function flashChangedTiers(before) {
  try {
    var after = tierSignature();
    var items = document.querySelectorAll('#timeline .timeline-item');
    for (var i = 0; i < after.length; i++) {
      if (before[i] !== after[i] && items[i]) items[i].classList.add('tier-flash');
    }
  } catch (e) { /* 纯增强 */ }
}

/* ---------- 「进行中」定位（全防御式：任何异常返回 null） ---------- */
function findNowProgress() {
  try {
    var t = (TRIP_DATA && TRIP_DATA.trip) || {};
    var ts = Date.parse(t.date);
    if (isNaN(ts)) return null;
    var tripDate = new Date(ts);
    var now = new Date();
    if (tripDate.getFullYear() !== now.getFullYear() ||
        tripDate.getMonth() !== now.getMonth() ||
        tripDate.getDate() !== now.getDate()) return null;
    var tl = TRIP_DATA.timeline || [];
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var activeIdx = -1;
    var nextIdx = -1;
    for (var i = 0; i < tl.length; i++) {
      var tm = tl[i].time || '';
      if (!/^\d{1,2}:\d{2}$/.test(tm)) continue;
      var parts = tm.split(':');
      var m = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      if (m <= nowMin) activeIdx = i;
      else if (nextIdx < 0) nextIdx = i;
    }
    if (activeIdx < 0) return null;
    return { active: activeIdx, next: nextIdx };
  } catch (e) { return null; }
}

/* 「进行中」卡：当前项 + 下一站 + 导航（当前或下一站有 navi 时） */
function renderNowCard() {
  try {
    var card = $('now-card');
    if (!card) return;
    var prog = findNowProgress();
    if (!prog) {
      card.style.display = 'none';
      card.innerHTML = '';
      return;
    }
    var tl = (TRIP_DATA && TRIP_DATA.timeline) || [];
    var cur = tl[prog.active] || {};
    var nxt = (prog.next >= 0) ? tl[prog.next] : null;
    var curLinks = cur.links || {};
    var navi = curLinks.amap_navi || cur.navi_url || '';
    if (!navi && nxt) {
      var nxtLinks = nxt.links || {};
      navi = nxtLinks.amap_navi || nxt.navi_url || '';
    }
    var html = '<div class="now-main"><span class="now-tag">进行中</span>' +
      '<span class="now-time">' + (cur.time || '') + '</span>' +
      '<span class="now-title">' + (cur.title || '') + '</span></div>';
    if (nxt) {
      html += '<div class="now-next">下一站 · ' + (nxt.time || '') + ' ' + (nxt.title || '') + '</div>';
    }
    if (navi) {
      html += '<a class="navi-btn" href="' + navi + '" target="_blank" rel="noopener">🧭 导航</a>';
    }
    card.innerHTML = html;
    card.style.display = '';
  } catch (e) { /* 静默降级 */ }
}

/* ---------- 「进行中」高亮（章内 item 高亮 + 自动滚动，全防御式） ---------- */
function highlightActiveItem(shouldScroll) {
  try {
    var prog = findNowProgress();
    if (!prog) return;
    var items = document.querySelectorAll('#timeline .timeline-item');
    var elx = items[prog.active];
    if (!elx) return;
    elx.classList.add('active-now');
    var label = elx.querySelector('.time-label');
    if (label) {
      var badge = document.createElement('span');
      badge.className = 'now-badge';
      badge.textContent = '进行中';
      label.appendChild(badge);
    }
    if (shouldScroll && elx.scrollIntoView) {
      elx.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } catch (e) { /* 静默降级：任何异常都不影响页面 */ }
}

/* ---------- scroll-spy：当前章节锚点高亮（纯增强，挂了不影响锚点跳转） ---------- */
var spyObserver = null;
function initScrollSpy() {
  try {
    if (spyObserver && spyObserver.disconnect) { spyObserver.disconnect(); spyObserver = null; }
    if (!('IntersectionObserver' in window)) return;
    var nav = $('day-nav');
    if (!nav || nav.style.display === 'none') return;
    var links = nav.querySelectorAll('a');
    if (!links.length) return;
    var map = {};
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href') || '';
      if (href.charAt(0) === '#') map[href.slice(1)] = links[i];
    }
    var sections = document.querySelectorAll('.day-chapter[id]');
    if (!sections.length) return;
    var currentId = null;
    var setActive = function (id) {
      if (id === currentId || !map[id]) return;
      currentId = id;
      for (var k in map) {
        if (map.hasOwnProperty(k)) {
          if (k === id) map[k].classList.add('active-day');
          else map[k].classList.remove('active-day');
        }
      }
    };
    spyObserver = new IntersectionObserver(function (entries) {
      for (var j = 0; j < entries.length; j++) {
        var en = entries[j];
        if (en.isIntersecting && en.target && en.target.id) setActive(en.target.id);
      }
    }, { rootMargin: '-63px 0px -65% 0px', threshold: 0 });
    for (var s = 0; s < sections.length; s++) spyObserver.observe(sections[s]);
  } catch (e) { /* 静默降级 */ }
}

/* ---------- 字号三档切换（标准 18px / 大字 20.5px / 特大 23px，localStorage 持久化） ---------- */
var FONT_SIZES = [18, 20.5, 23];
var FONT_LABELS = ['标准', '大字', '特大'];
var fontIdx = 0;
try {
  fontIdx = parseInt(localStorage.getItem('tp-font-idx') || '0', 10);
  if (isNaN(fontIdx) || fontIdx < 0 || fontIdx >= FONT_SIZES.length) fontIdx = 0;
} catch (e) { fontIdx = 0; }

function applyFontSize() {
  document.documentElement.style.fontSize = FONT_SIZES[fontIdx] + 'px';
  var lb = $('font-label');
  if (lb) lb.textContent = FONT_LABELS[fontIdx];
  try { localStorage.setItem('tp-font-idx', String(fontIdx)); } catch (e) {}
}

function cycleFontSize() {
  fontIdx = (fontIdx + 1) % FONT_SIZES.length;
  applyFontSize();
}
applyFontSize();

/* ---------- 回到顶部（滚动超过 600px 显示） ---------- */
window.addEventListener('scroll', function () {
  var btn = $('back-top');
  if (btn) btn.style.display = (window.scrollY > 600) ? 'flex' : 'none';
});
function scrollTop() {
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }
}

document.addEventListener('DOMContentLoaded', function () {
  render();
  // 不自动滚动（09-06 产品审查：打开即跳转会打断从封面开始的阅读起点），仅高亮当前项
  highlightActiveItem(false);
});

/* ---------- 复制地址（事件委托；clipboard API + execCommand 兜底） ---------- */
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('.copy-addr') : null;
  if (!b) return;
  var text = b.getAttribute('data-addr') || '';
  var done = function () {
    var orig = b.textContent;
    b.textContent = '✓ 已复制';
    setTimeout(function () { b.textContent = orig; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, done);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    done();
  }
});
</script>
